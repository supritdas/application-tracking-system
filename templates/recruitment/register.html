{% extends "recruitment/base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<article style="max-width:560px;margin:auto">
  <h2>Create your account</h2>
  <form method="post">
    {% csrf_token %}
    {% include "recruitment/_form_fields.html" %}
    <button type="submit">Sign up</button>
  </form>
  <small>Already registered? <a href="{% url 'recruitment:login' %}">Log in</a></small>
</article>
{% endblock %}
