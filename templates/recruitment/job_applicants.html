{% extends "recruitment/base.html" %}
{% block title %}Applicants &middot; {{ job.title }}{% endblock %}
{% block content %}
<hgroup><h2>{{ job.title }}</h2><p>Applicants, ranked by AI match score</p></hgroup>

<form hx-get="{% url 'recruitment:job_applicants' job.pk %}" hx-target="#results"
      hx-trigger="input delay:400ms, change" hx-push-url="true">
  <div class="grid">
    <input type="search" name="q" placeholder="Name or email" value="{{ request.GET.q }}">
    <input type="text" name="skills" placeholder="Skills (all required): python, django" value="{{ request.GET.skills }}">
    <select name="status">
      <option value="">Any status</option>
      {% for v, label in statuses %}<option value="{{ v }}" {% if request.GET.status == v %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
    <input type="number" name="min_score" min="0" max="100" placeholder="Min score" value="{{ request.GET.min_score }}">
    <select name="sort">
      <option value="">Best match first</option>
      <option value="newest" {% if request.GET.sort == "newest" %}selected{% endif %}>Newest first</option>
    </select>
  </div>
</form>

<div id="results">{% include "recruitment/_applicant_rows.html" %}</div>
{% endblock %}
